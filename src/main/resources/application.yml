server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/quality_vision?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# VLM 配置：换厂商只改 base-url / api-key / model 三处
# mock-enabled=true：不调外部接口，离线可演示；false 走真实 VLM
vlm:
  base-url: https://api.deepseek.com/v1
  api-key: ${VLM_API_KEY:}
  model: deepseek-flash
  temperature: 0.2
  timeout-seconds: 60
  max-retries: 2
  mock-enabled: false

# 上传图片存储目录（相对路径，相对于启动目录）
qv:
  upload-dir: ./uploads
